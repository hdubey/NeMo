# VoiceTranslate-v1 — DuplexEARTTS + Riva-Translate-4B-Instruct
# Branch: voicetranslate-v1/eartts_inter
# Repo:   github.com/hdubey/private-nv-NeMo-s2s (private)
# Created: 2026-04-16
#
# BASE: examples/speechlm2/conf/duplex_eartts.yaml (Edresson's base — kept as-is)
# CHANGES vs Edresson's base (minimum required):
#   1. pretrained_lm_name  : Nemotron-9B → Riva-Translate-4B-Instruct-v1.1 (local path)
#   2. pretrained_audio_codec removed; pretrained_codec_model: null added  (TODO: Edresson ckpt)
#   3. bos/eos/pad tokens  : Nemotron tokens → null (use Riva-4B tokenizer defaults)
#   4. optimizer.lr        : 4e-5 → 1e-4  (Nourchene's Riva-4B setting)
#   5. optimizer.warmup    : 2500 → 4000  (Nourchene's Riva-4B setting)
#   6. trainer.precision   : 32 → bf16-true
#   7. trainer.max_steps   : 1000000 → 100000
#   8. data.train_ds       : ??? → Nourchene's multi_config lhotse shards (FR/ES/DE→EN)
#   9. data.validation_ds  : ??? → Nourchene's CVSS eval sets
#  10. exp_manager paths   : updated to hdubey's dirs
#
# UNTOUCHED from Edresson (everything else):
#   tts_config (backbone, cas_config, mog_head, all params)
#   codec_config (all params)
#   freeze_params, inference params, DDP strategy, gradient_clip_val

model:
  pretrained_lm_name: "/lustre/fsw/portfolios/edgeai/users/amhussein/cache/HFCACHE/hub/models--nvidia--Riva-Translate-4B-Instruct-v1.1/snapshots/f859e48c4c82696c5929cd06590f600a41dc7f3c"

  # EarTTS pretrained checkpoints from Edresson (ecasanova).
  # tts_model: eartts_rvq_cont_task (Gemma3-1B + 31-codebook RVQ, 5.2GB) — tts_model.* keys load directly.
  # codec_model: same ckpt — audio_codec.* keys stripped and loaded into RVQVAEModel.
  # Debug confirmed: tts_model.backbone shape=(1152,4608) = Gemma3-1B; audio_codec.decoder shape=(512,1536,9).
  pretrained_tts_model: "/lustre/fsw/portfolios/edgeai/users/hdubey/pretrained_models/full-duplex/models/tts/ear-tts/eartts_rvq_cont_task_qwen_22khz_synthetic_duplex_data_plus_blackwell_4nodes_FT_cont_22khz_12.5FPS_text_bos_eos_fix_duplex_nanov2_new_special_tokens_no_context_emb_20366-last.ckpt"
  pretrained_codec_model: "/lustre/fsw/portfolios/edgeai/users/hdubey/pretrained_models/full-duplex/models/tts/ear-tts/eartts_rvq_cont_task_qwen_22khz_synthetic_duplex_data_plus_blackwell_4nodes_FT_cont_22khz_12.5FPS_text_bos_eos_fix_duplex_nanov2_new_special_tokens_no_context_emb_20366-last.ckpt"

  scoring_asr: stt_en_fastconformer_transducer_large

  # ── Combined loss weights (Nourchene-style) ─────────────────────────────────
  # audio_loss_weight : multiplier on EarTTS audio output loss
  # text_loss_weight  : multiplier on source-language transcription loss (ASR head)
  # Nourchene uses audio=4, text=3 for DuplexS2S — kept as default here.
  audio_loss_weight: 4
  text_loss_weight: 3

  # ── Audio loss type ──────────────────────────────────────────────────────────
  # "mog"          — Mixture-of-Gaussians NLL + KL (Edresson default, best tested)
  # "discrete_xe"  — Cross-entropy on codebook indices (Hibiki/VALL-E style, simpler)
  # "combined"     — MoG NLL + KL + discrete XE together (most signal, recommended)
  # "flow_matching" — OT-CFM on codec latents (SOTA quality; stub, not yet implemented)
  audio_loss_type: "mog"   # DEFAULT: keep Edresson's proven loss until ablation done

  # ── EarTTS sub-loss weights (active for "mog" and "combined") ───────────────
  # All default to 1.0 — identical to original Edresson behaviour.
  lm_loss_weight: 1.0      # EOS token prediction (cross-entropy)
  c_loss_weight:  1.0      # MoG NLL (continuous codec latent loss)
  k_loss_weight:  1.0      # KL divergence (mixture prior regularization)

  # Regexp (re.compile) patterns matching parameters to be frozen.
  # Nourchene convention (adapted for DuplexEARTTS):
  #   audio_codec     — always frozen (codec used only for encoding/decoding, no pretrained ckpt yet)
  #   tts_model.backbone — frozen for initial debug/SFT; remove this line for full LLM-unfreeze run
  # NOTE: there is no perception encoder in DuplexEARTTS (unlike DuplexS2SSpeechDecoderModel),
  #       so "freeze ASR encoder" (^perception.encoder) does not apply here.
  freeze_params:
    - "^audio_codec\\..+$"             # RVQVAEModel codec — always frozen
    - "^tts_model\\..+$"               # Entire EarTTS model frozen; pretrained weights preserved during VT-v1 SFT
    # To unfreeze TTS for full SFT, replace the above with:
    #   - "^tts_model\\.backbone\\..+$"   # backbone-only freeze (Gemma3 frozen, audio heads trainable)
    # To unfreeze everything except codec, remove the tts_model line entirely.
  prevent_freeze_params: []

  # Riva-4B tokenizer defaults (null = use tokenizer's own bos/eos/pad)
  bos_token: null
  eos_token: null
  pad_token: null

  # inference params — unchanged from Edresson
  inference_guidance_scale: 0.5
  inference_noise_scale: 0.8
  inference_top_p_or_k: 0.8
  inference_guidance_enabled: true

  # optimizer — lr/warmup updated to Nourchene's Riva-4B settings; rest unchanged
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    betas: [0.9, 0.98]
    weight_decay: 0
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.InverseSquareRootAnnealing
    warmup_steps: 4000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

  # codec_config — UNCHANGED from Edresson
  codec_config:
    latent_size: 512
    n_fft: 16
    hop_length: 4
    base_hidden_size: 384
    channel_mult:
      - 1
      - 2
      - 4
    rates:
      - 7
      - 7
      - 9
    num_blocks: 3
    kernel_size: 7
    groups: 1
    codebook_size: 1024
    num_quantizers: 31
    wav_to_token_ratio: 1764

  # tts_config — UNCHANGED from Edresson (gemma3_text/hidden=1152 matches eartts_rvq_cont_task ckpt).
  # Confirmed via debug: eartts_rvq_cont_task_...20366-last.ckpt backbone shape=(1152, 4608) = Gemma3-1B.
  tts_config:
    use_gated_fusion_for_text_audio: true
    disable_eos_prediction: true
    use_bos_eos_emb: true
    use_subword_flag_emb: true
    num_delay_speech_tokens: 2
    backbone_type: gemma3_text
    backbone_model_class: null
    backbone_config_class: null
    backbone_config:
      hidden_size: 1152
      intermediate_size: 4608
      num_hidden_layers: 28
      num_attention_heads: 16
      num_key_value_heads: 16
      head_dim: 72
      attention_dropout: 0.1
      use_cache: false
    latent_size: 512
    codebook_size: 1024
    num_quantizers: 31
    context_hidden_size: null
    cas_config:
      # t5gemma is not registered in the container's transformers version — use BertModel as drop-in.
      # When t5gemma support lands (transformers >= x.x.x), restore: backbone_type: t5gemma,
      # backbone_model_class: null, backbone_config_class: null, and the encoder sub-config.
      backbone_type: null
      backbone_model_class: BertModel
      backbone_config_class: BertConfig
      backbone_config:
        hidden_size: 1152
        num_hidden_layers: 1
        num_attention_heads: 16
        intermediate_size: 4608
        hidden_dropout_prob: 0.1
        attention_probs_dropout_prob: 0.1
        max_position_embeddings: 512
        vocab_size: 131072
    mog_head_config:
      intermediate_size: 4608
      num_layers: 3
      low_rank: 64
      num_predictions: 1024
      min_log_std: -4.0
      eps: 1e-06
    p_uncond: 0.1
    label_smoothing: 0.01
    max_training_rate: 0.8
    quantizer_dropout: 0.5
    random_target_masking: false
    exponent: 3.0

# trainer — precision and max_steps updated; rest unchanged from Edresson
trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 100000
  val_check_interval: 1000
  limit_train_batches: ${trainer.val_check_interval}
  limit_val_batches: 2
  log_every_n_steps: 20
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true

# data — train_ds/validation_ds filled from Nourchene; frame params unchanged from Edresson
data:
  add_text_bos_and_eos_in_each_turn: true
  add_audio_prompt_after_description: true
  audio_prompt_duration: 3.0
  frame_length: 0.08
  source_sample_rate: 22050
  target_sample_rate: 22050
  input_roles: ["user", "User"]
  output_roles: ["agent", "Assistant", "assistant", "Agent"]

  train_ds:
    sample_rate: ${data.target_sample_rate}
    multi_config: true
    shuffle: true
    sampler_fusion: randomized_round_robin
    seed: 42
    shard_seed: "trng"
    num_workers: 8        # MUST be at train_ds level — multi_config gather_shared_opts() reads from here, overrides sub-configs
    pin_memory: true      # same: shared_opts overwrites per-sub-config value
    sampler_weights:
      riva_mult: 1.0
    riva_mult:
      input_cfg: /lustre/fsw/portfolios/edgeai/users/amhussein/s2s/configs/data/riva_multiling_st_concat_v_mfa_target_aligned.yaml
      bucket_buffer_size: 2000    # reduced from 10000 — fills in ~18 min vs ~90 min
      shuffle_buffer_size: 2000
      max_duration: 60
      min_duration: 1
      num_buckets: 30
      bucket_duration_bins: [5.33,6.27,6.96,7.54,8.07,8.55,8.99,9.39,9.76,10.14,10.54,10.99,11.49,12.04,12.64,13.28,13.96,14.69,15.48,16.32,17.25,18.28,19.39,20.65,22.14,24.01,26.34,29.21,32.79]
      batch_duration: 400
      batch_size: 4
      use_bucketing: true
      seed: 'trng'

  validation_ds:
    datasets:
      # CVSS eval sets — MUST use these for validation, NOT training shards.
      # Reason: force_map_dataset=True (hard-coded in datamodule) materializes cuts without loading
      # tar files → shar-format audio sources stay as empty placeholders → load_audio() crashes.
      # CVSS cuts use file-path recordings (not shar), so they work fine with force_map_dataset.
      # SECS metric is meaningless (no target_audio), but ASR-BLEU is valid. See TODO_Apr16.md P0.
      # Using 5 shards each (reduced from 20) to speed up validation while still covering ~500 samples/lang.
      cvss-FrTest:
        shar_path:
          cuts:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/cuts.000000.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/cuts.000001.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/cuts.000002.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/cuts.000003.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/cuts.000004.jsonl.gz
          recording:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/recording.000000.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/recording.000001.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/recording.000002.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/recording.000003.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/fr-FR_en-US/test/recording.000004.tar
      cvss-EsTest:
        shar_path:
          cuts:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/cuts.000000.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/cuts.000001.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/cuts.000002.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/cuts.000003.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/cuts.000004.jsonl.gz
          recording:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/recording.000000.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/recording.000001.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/recording.000002.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/recording.000003.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/es-US_en-US/test/recording.000004.tar
      cvss-DeTest:
        shar_path:
          cuts:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/cuts.000000.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/cuts.000001.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/cuts.000002.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/cuts.000003.jsonl.gz
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/cuts.000004.jsonl.gz
          recording:
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/recording.000000.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/recording.000001.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/recording.000002.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/recording.000003.tar
          - /lustre/fsw/portfolios/edgeai/users/amhussein/lhotse_data_eval_mfa/cvss/de-DE_en-US/test/recording.000004.tar
    sample_rate: ${data.target_sample_rate}
    batch_size: 1
    num_workers: 4        # validation uses force_map_dataset; 4 workers parallelize shard I/O (default is 0 = single-threaded)
    pin_memory: true
    seed: 42
    shard_seed: "randomized"

exp_manager:
  exp_dir: null
  explicit_log_dir: /lustre/fsw/portfolios/edgeai/users/hdubey/s2s_exp/eartts/riva4b_vt_v1
  name: eartts_riva4b_voicetranslate_v1
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  use_datetime_version: false
  max_time_per_run: "00:03:50:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: true
  wandb_logger_kwargs:
    name: eartts_riva4b_voicetranslate_v1
    project: duplex_s2s_st_eartts
    entity: riva-nemo-llm-mlops
    resume: true

  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_asr_bleu
    mode: max
    every_n_train_steps: null
    every_n_epochs: 1
    save_top_k: 3
    always_save_nemo: false
